name: CloudFormation deploy

on:
  pull_request:
    types: [closed]
    branches:
      - develop/*
      - qa/*
      - prod/*
  push:
    branches:
      - develop/*

env:
  REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref, 'develop/') && 'develop' || contains(github.ref, 'qa/') && 'qa' || contains(github.ref, 'prod/') && 'prod' }}
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Determine environment and branch
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ref_part="${{ github.base_ref }}"
          else
            ref_part="${{ github.ref_name }}"
          fi
          
          env_name="${ref_part%%/*}"
          branch_name="${ref_part#*/}"
          
          case "${env_name,,}" in
            develop) env_value="dev" ;;
            qa) env_value="qa" ;;
            prod) env_value="prod" ;;
            *) env_value="${env_name,,}" ;;
          esac
          
          echo "ENVIRONMENT=$env_value" >> $GITHUB_ENV
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set configuration files
        run: |
          echo "PARAMETERS_FILE=./parameters-$ENVIRONMENT.json" >> $GITHUB_ENV
          echo "TAG_FILE=./tags_$ENVIRONMENT.json" >> $GITHUB_ENV

      - name: Load parameters
        run: |
          jq -r '.[] | "\(keys[0])=\(.[keys[0]] | tostring)"' $PARAMETERS_FILE >> $GITHUB_ENV
          echo "Loaded variables from $PARAMETERS_FILE"

      - name: Process tags
        run: |
          TAGS=$(jq -r 'map("\(.Key)=\(.Value | gsub(" "; "_") | gsub("&"; "y"))") | join(" ")' $TAG_FILE)
          echo "TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Validate Variables
        run: |
          echo "=== VARIABLES VALIDATION ==="
          echo "Core Variables:"
          echo "- TEAM: $TEAM"
          echo "- ENVIRONMENT: $ENVIRONMENT"
          echo "- REPOSITORY_NAME: $REPOSITORY_NAME"
          echo "- BRANCH_NAME: $BRANCH_NAME"
          echo "- STACK_NAME: $STACK_NAME"
          
          echo "\nAWS Variables:"
          echo "- ARTIFACTORY_BUCKET: $ARTIFACTORY_BUCKET"
          echo "- REGION: $REGION"
          echo "- AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID"
          echo "- AWS_ACCOUNT_ID_OPT: $AWS_ACCOUNT_ID_OPT"
          echo "- AWS_ACCOUNT: $AWS_ACCOUNT"
          echo "- AWS_RUTADIGITAL_ID: $AWS_RUTADIGITAL_ID"
          
          echo "\nDatabase Variables:"
          echo "- DB_STAGE: $DB_STAGE"
          echo "- DB_ANALYTICS: $DB_ANALYTICS"
          
          echo "\nDeployment Metadata:"
          echo "- TIMESTAMP: $TIMESTAMP"
          echo "- TAGS: $TAGS"
          
          # Verificación de variables críticas
          if [ -z "$ARTIFACTORY_BUCKET" ] || [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Critical variables are missing!"
            exit 1
          fi
      
      - name: Set stack name
        run: echo "STACK_NAME=da-${BRANCH_NAME}-ecodistribucion" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.REGION }}

      - name: Check for Glue Jobs
        id: check_jobs
        run: |
          if [ -f "deploy_parameters/glue.yaml" ]; then
            JOBS_COUNT=$(yq eval '.glue | length' deploy_parameters/glue.yaml)
            echo "jobs_count=${JOBS_COUNT}" >> $GITHUB_OUTPUT
            echo "Contenido de glue.yaml:"
            yq eval '.' deploy_parameters/glue.yaml
          else
            echo "jobs_count=0" >> $GITHUB_OUTPUT
            echo "Warning: Archivo glue.yaml no encontrado"
          fi

      - name: Upload Glue Scripts to S3
        if: steps.check_jobs.outputs.jobs_count > 0
        run: |
          echo "=== INICIO DE CARGA DE SCRIPTS GLUE ==="
          
          # Instalar yq si no está presente (versión compatible)
          if ! command -v yq &> /dev/null; then
            sudo snap install yq
          fi
          
          # Verificación explícita del archivo YAML
          echo "Contenido de glue.yaml:"
          cat deploy_parameters/glue.yaml
          
          # Procesamiento robusto
          while read -r JOB; do
            # Extraer valores usando eval seguro
            JOB_NAME=$(echo "$JOB" | yq eval '.name' -)
            SCRIPT_PATH=$(echo "$JOB" | yq eval '.path' -)
            
            echo "Procesando Job: $JOB_NAME"
            echo "Script Path Extraído: $SCRIPT_PATH"
            
            # Validación estricta
            if [[ -z "$SCRIPT_PATH" || "$SCRIPT_PATH" == "null" ]]; then
              echo "::error::El campo 'path' no se extrajo correctamente para $JOB_NAME"
              echo "Contenido crudo del job:"
              echo "$JOB"
              exit 1
            fi
            
            # Construir ruta S3
            S3_PATH="s3://${ARTIFACTORY_BUCKET}/stage_lib/glue/${JOB_NAME}/src/$(basename "$SCRIPT_PATH")"
            
            # Verificar existencia del archivo
            if [ ! -f "$SCRIPT_PATH" ]; then
              echo "::error::El archivo $SCRIPT_PATH no existe"
              echo "Ruta absoluta probada: $(pwd)/$SCRIPT_PATH"
              exit 1
            fi
            
            # Subir a S3
            echo "Subiendo $SCRIPT_PATH a $S3_PATH"
            aws s3 cp "$SCRIPT_PATH" "$S3_PATH" || exit 1
            echo "Carga exitosa para $JOB_NAME"
            
          done < <(yq eval -j '.glue[]' deploy_parameters/glue.yaml | jq -c .)
          
          echo "=== CARGA COMPLETADA ==="

      
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file templates/template.yaml \
            --region $REGION \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --tags $TAGS \
            --parameter-overrides \
              pTeamName=$TEAM \
              Stage=$ENVIRONMENT \
              pBranchName=$BRANCH_NAME \
              pArtifactsBucket=$ARTIFACTORY_BUCKET \
              pAWSRegion=$REGION \
              pAWSAccountId=$AWS_ACCOUNT_ID \
              pAWSAccountOpt=$AWS_ACCOUNT_ID_OPT \
              pdbStageName=$DB_STAGE \
              pAccountName=$AWS_ACCOUNT \
              pdeploymentDate=$TIMESTAMP
          
          aws cloudformation describe-stack-events --stack-name $STACK_NAME --max-items 5

      - name: Load Lambdas configuration
        id: load_lambdas
        run: |
          if [ -f "deploy_parameters/lambdas.yaml" ]; then
            LAMBDAS=$(yq -o=json '.' deploy_parameters/lambdas.yaml | jq -c '.lambdas? // empty')
            if [ -n "$LAMBDAS" ] && [ "$LAMBDAS" != "null" ]; then
              echo "LAMBDAS=$LAMBDAS" >> $GITHUB_ENV
              echo "HAS_LAMBDAS=true" >> $GITHUB_ENV
            else
              echo "HAS_LAMBDAS=false" >> $GITHUB_ENV
              echo "No Lambdas found or file is empty"
            fi
          else
            echo "HAS_LAMBDAS=false" >> $GITHUB_ENV
            echo "lambdas.yaml file not found"
          fi

      - name: Deploy Lambda functions
        if: env.HAS_LAMBDAS == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zip"
          
          echo "$LAMBDAS" | jq -c '.[]' | while read -r item; do
            lambda_name=$(echo "$item" | jq -r '.name')
            lambda_path=$(echo "$item" | jq -r '.path')
            zip_path="$GITHUB_WORKSPACE/zip/$lambda_name.zip"
            
            echo "Processing Lambda: $lambda_name"
            
            if [ -d "$GITHUB_WORKSPACE/$lambda_path" ]; then
              (cd "$GITHUB_WORKSPACE/$lambda_path" && zip -r "$zip_path" ./*)
              
              aws s3 cp "$zip_path" "s3://$ARTIFACTORY_BUCKET/stage_lib/lambda/$lambda_name/"
              
              aws lambda update-function-code \
                --function-name "$lambda_name" \
                --s3-bucket "$ARTIFACTORY_BUCKET" \
                --s3-key "stage_lib/lambda/$lambda_name/$lambda_name.zip" \
                --region "$REGION" \
                --publish
            else
              echo "Warning: Directory $lambda_path not found. Skipping $lambda_name"
            fi
          done

      - name: Update Existing Glue Jobs
        if: steps.check_jobs.outputs.jobs_count > 0
        run: |
          echo "=== ACTUALIZACIÓN DE JOBS GLUE ==="
          
          # Install yq if not present
          if ! command -v yq &> /dev/null; then
            echo "Installing yq..."
            sudo snap install yq || { echo "Failed to install yq"; exit 1; }
          fi
          
          # Validate glue.yaml file
          if [ ! -f "deploy_parameters/glue.yaml" ]; then
            echo "::error::File deploy_parameters/glue.yaml not found"
            exit 1
          fi
          
          # Validate required variables
          if [ -z "${ARTIFACTORY_BUCKET}" ]; then
            echo "::error::ARTIFACTORY_BUCKET is not set"
            exit 1
          fi
          
          # Process jobs safely
          yq eval -j '.glue[]' deploy_parameters/glue.yaml | jq -c '.' | while read -r JOB; do
            JOB_NAME=$(echo "$JOB" | jq -r '.name')
            
            # Validate job name
            if [ -z "$JOB_NAME" ] || [ "$JOB_NAME" = "null" ]; then
              echo "::warning::Skipping job with empty name"
              continue
            fi
            
            SCRIPT_PATH=$(echo "$JOB" | jq -r '.path')
            if [ -z "$SCRIPT_PATH" ] || [ "$SCRIPT_PATH" = "null" ]; then
              echo "::error::Job $JOB_NAME has no path specified"
              exit 1
            fi
            
            SCRIPT_NAME=$(basename "$SCRIPT_PATH")
            S3_PATH="s3://${ARTIFACTORY_BUCKET}/stage_lib/glue/${JOB_NAME}/src/${SCRIPT_NAME}"
            
            echo "Processing Job: $JOB_NAME"
            echo "Script Location: $S3_PATH"
            
            # Check if job exists
            if ! aws glue get-job --job-name "$JOB_NAME" >/dev/null 2>&1; then
              echo "::warning::Job $JOB_NAME does not exist (skipping)"
              continue
            fi
            
            # Prepare update payload
            UPDATE_PAYLOAD=$(jq -n \
              --arg script_location "$S3_PATH" \
              '{
                "Command": {
                  "ScriptLocation": $script_location,
                  "Name": "glueetl"
                }
              }')
            
            # Update job
            echo "Updating Job $JOB_NAME..."
            if aws glue update-job --job-name "$JOB_NAME" --job-update "$UPDATE_PAYLOAD"; then
              echo "Successfully updated $JOB_NAME"
            else
              echo "::error::Failed to update $JOB_NAME"
              exit 1
            fi
          done
          
          echo "=== ACTUALIZACIÓN COMPLETADA ==="