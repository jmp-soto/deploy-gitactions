name: CloudFormation deploy#

on:
  pull_request:
    types: [closed]
    branches: [develop, qa, prod]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write
        
    env:
      ENVIRONMENT: ${{ github.base_ref == 'develop' && 'dev' || github.base_ref }}
      REGION: "us-east-1"

    steps:
      - name: Set timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Define environment
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=${{ github.base_ref }}" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Parameters File
        run: |
          echo "PARAMETERS_FILE=./parameters-$ENVIRONMENT.json" >> $GITHUB_ENV
      
      - name: Load JSON into Environment Variables
        run: |
          for row in $(jq -c '.[]' "$PARAMETERS_FILE"); do
            key=$(echo "$row" | jq -r 'keys[0]')
            value=$(echo "$row" | jq -r '.[]')
            echo "::add-mask::$value"
            echo "${key}=${value}" >> $GITHUB_ENV
          done
          echo "Loaded variables from $PARAMETERS_FILE."
      
      - name: Validate Variables
        run: |
          echo "TEAM=$TEAM"
          echo "ENVIRONMENT=$ENVIRONMENT"
          echo "BRANCH_NAME=$BRANCH_NAME"
          echo "REPOSITORY_NAME=$REPOSITORY_NAME"
          echo "ARTIFACTORY_BUCKET=$ARTIFACTORY_BUCKET"

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: darolesession
          aws-region: ${{ env.REGION }}

      - name: Install yq and jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Get PR title
        id: pr_title
        run: echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV

      - name: Load Lambdas from YAML
        id: load_lambdas
        run: |
          LAMBDAS=$(yq -o=json '.' templates/lambdas.yaml | jq -c '.lambdas')
          echo "LAMBDAS=$LAMBDAS" >> $GITHUB_ENV

      - name: Extract Lambdas to update (match exact name in PR title)
        run: |
          set -euo pipefail
          echo "PR title: $PR_TITLE"
          MATCHING_LAMBDAS=()
          while read -r row; do
            LAMBDA_NAME=$(echo "$row" | jq -r '.name')
            LAMBDA_PATH=$(echo "$row" | jq -r '.path')
            # Coincidencia exacta (sensible a mayúsculas/minúsculas) por subcadena
            if [[ "$PR_TITLE" == *"$LAMBDA_NAME"* ]]; then
              MATCHING_LAMBDAS+=("$LAMBDA_NAME:$LAMBDA_PATH")
            fi
          done < <(echo "$LAMBDAS" | jq -c '.[]')

          if [ ${#MATCHING_LAMBDAS[@]} -eq 0 ]; then
            echo "No matching Lambdas found. Skipping update."
            exit 0
          fi

          # Unicos
          printf "%s\n" "${MATCHING_LAMBDAS[@]}" | sort -u > lambdas_to_update.txt
          echo "Lambdas to update:"
          cat lambdas_to_update.txt

          echo "LAMBDAS_TO_UPDATE=\"$(paste -sd' ' lambdas_to_update.txt)\"" >> $GITHUB_ENV

      - name: Zip and upload selected Lambdas
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/zip"
          
          for item in ${LAMBDAS_TO_UPDATE}; do
            LAMBDA_NAME=$(echo "$item" | cut -d':' -f1 | tr -d '"')
            LAMBDA_PATH=$(echo "$item" | cut -d':' -f2 | tr -d '"')
            ZIP_PATH="$GITHUB_WORKSPACE/zip/$LAMBDA_NAME.zip"

            echo ""
            echo "Processing Lambda: $LAMBDA_NAME from path: $LAMBDA_PATH"

            FULL_PATH=$(realpath "$GITHUB_WORKSPACE/$LAMBDA_PATH" || true)
            echo "DEBUG: FULL_PATH='$FULL_PATH'"
            ls -la "$FULL_PATH" || echo "Warning: No se pudo listar el contenido."

            if [ -z "$FULL_PATH" ] || [ ! -d "$FULL_PATH" ]; then
              echo "Error: La carpeta $FULL_PATH no existe. Saltando..."
              continue
            fi

            (
              cd "$FULL_PATH"
              zip -r "$ZIP_PATH" ./* \
                -x "**/.git/**" "**/.github/**" "**/__pycache__/**" "**/.pytest_cache/**" "**/node_modules/**" "**/*.pyc" "**/.DS_Store"
            )

            echo "Uploading ZIP to S3..."
            aws s3 cp "$ZIP_PATH" "s3://$ARTIFACTORY_BUCKET/src/lambda/$LAMBDA_NAME/"

            echo "Updating AWS Lambda function..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --s3-bucket "$ARTIFACTORY_BUCKET" \
              --s3-key "src/lambda/$LAMBDA_NAME/$LAMBDA_NAME.zip" \
              --region "${{ env.REGION }}" \
              --publish
          done
